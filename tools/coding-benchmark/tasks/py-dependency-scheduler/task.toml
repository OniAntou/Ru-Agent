schema_version = "1.4"

[metadata]
id = "py-dependency-scheduler"
language = "python"
difficulty = "hard"
category = "software-engineering"
editable_globs = ["src/**/*.py"]
check_groups = ["graph-atomicity", "deterministic-readiness", "parallel-capacity", "transition-integrity", "retry-budget", "cancellation-propagation"]

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 120

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 10240
network_mode = "no-network"
