[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bilingual-mini-gpt"
version = "0.1.0"
description = "An educational Vietnamese-English decoder-only language model trained from scratch."
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "tokenizers>=0.20",
    "torch>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

