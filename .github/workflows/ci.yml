name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,tooling]"
      # No -n cap: the checkout is shallow, so this inspects every commit the
      # checkout contains rather than silently stopping at an arbitrary window.
      - run: git log --check --format=
      - run: python -m pytest -q
      - run: python scripts/check_aspnetcore_route_matrix.py
      - run: python scripts/check_python_runtime_boundary.py
      - run: python -m ruff check tests scripts tools
      - run: pip check

  dotnet:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - run: git log --check --format=
        shell: pwsh
      - name: Install terminal test prerequisite
        shell: pwsh
        run: .\scripts\prepare_ci_terminal.ps1
      - name: Run all .NET tests
        shell: pwsh
        run: .\scripts\test_dotnet.ps1 -Configuration Debug
      - name: Agent loop performance and request-prefix gate (synthetic)
        id: agent_performance
        shell: pwsh
        timeout-minutes: 5
        run: .\scripts\benchmark_agent_loop.ps1
      - name: Preserve agent performance evidence
        if: ${{ always() && steps.agent_performance.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-loop-performance
          path: artifacts/agent-performance/
          if-no-files-found: ignore
      - run: dotnet build gui-winui3.Harness/RuApp.Harness.csproj -c Release --nologo
      - run: dotnet build gui-winui3/RuApp.csproj -c Release -r win-x64 -p:Platform=x64 -p:SelfContained=true
      - name: RPC smoke (scripted model)
        shell: pwsh
        run: .\scripts\rpc_smoke.ps1
      - name: Publish smoke (Release, self-contained)
        shell: pwsh
        run: .\scripts\publish_smoke.ps1
      - name: Dependency audit (advisory)
        shell: pwsh
        # Report transitive NuGet advisories without letting the scan itself fail
        # the gate. The escape is scoped to this step; build and test steps above
        # stay fatal, and the contract test still bans blanket non-blocking flags.
        run: dotnet list RuAgent.slnx package --vulnerable --include-transitive || exit 0
      - name: GUI dependency audit (advisory)
        shell: pwsh
        # RuApp is intentionally built separately from the cross-platform solution
        # because WinUI requires an explicit x64 platform and Windows SDK.
        run: dotnet list gui-winui3/RuApp.csproj package --vulnerable --include-transitive || exit 0

  node:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix sdk/ru-agent
      - run: npm run typecheck --prefix sdk/ru-agent
      - run: npm test --prefix sdk/ru-agent
      - run: npm run build --prefix sdk/ru-agent
      - name: Dependency audit (advisory)
        # The SDK has no production dependencies, so --omit=dev keeps the known
        # dev-only advisories informational instead of gate-blocking.
        run: npm audit --prefix sdk/ru-agent --omit=dev || exit 0
