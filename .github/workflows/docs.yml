name: Docs

# Publishes the documentation site (docs-site/) to GitHub Pages. Pages itself has to be switched
# on once in the repository settings: Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [dev]
    paths:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CONTEXT.md"
      - "AGENTS.md"
      - "backend-dotnet/RuAgent.Cli/README.md"
      - "sdk/ru-agent/README.md"
      - "tools/coding-benchmark/README.md"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt
      - run: python -m pip install -r docs-site/requirements.txt
      - run: python docs-site/build.py --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
