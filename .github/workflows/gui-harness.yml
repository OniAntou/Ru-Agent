name: Ru GUI Voice Harness

on:
  workflow_dispatch:

jobs:
  gui-harness:
    runs-on: [self-hosted, windows, ru-gui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish RuApp
        shell: pwsh
        run: dotnet publish gui-winui3/RuApp.csproj -c Release -r win-x64 --self-contained true --nologo
      - name: Build typed GUI driver
        shell: pwsh
        run: dotnet build gui-winui3.Harness/RuApp.Harness.csproj -c Release --nologo
      - name: Run deterministic voice scenarios
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\run_gui_voice_harness.ps1 -AppPath "$env:GITHUB_WORKSPACE\gui-winui3\bin\Release\net10.0-windows10.0.26100.0\win-x64\publish\RuApp.exe" -DriverProject "$env:GITHUB_WORKSPACE\gui-winui3.Harness\RuApp.Harness.csproj" -OutputPath "$env:GITHUB_WORKSPACE\artifacts\gui\ru-harness-vnext-gui.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ru-harness-vnext-gui
          path: artifacts/gui/ru-harness-vnext-gui.json
