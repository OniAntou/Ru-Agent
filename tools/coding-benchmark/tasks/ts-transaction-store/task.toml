schema_version = "1.4"

[metadata]
id = "ts-transaction-store"
language = "typescript"
difficulty = "hard"
category = "software-engineering"
editable_globs = ["src/**/*.ts"]
check_groups = ["ordered-batch", "atomic-rejection", "replay-binding", "version-conflict", "generated-batches", "snapshot-isolation", "concurrent-linearizability"]

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 120

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 10240
network_mode = "no-network"
