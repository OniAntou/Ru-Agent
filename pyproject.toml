[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ru-runtime"
version = "0.1.0"
description = "Repository tooling for the Ru Agent workspace."
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "packaging>=24",
    "ruff==0.16.2",
]
tooling = [
    "httpx>=0.25",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["scripts", "."]
testpaths = ["tests"]
norecursedirs = [".venv", ".venv311", "omnivoice_env", "models", ".tmp", ".worktrees", "pip-cache", ".pytest_cache", ".minigpt", "gui-winui3", "backend-dotnet", "logs", "artifacts", "data"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
