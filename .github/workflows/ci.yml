name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,runtime]"
      - run: python -m pytest -q
      - run: python scripts/check_aspnetcore_route_matrix.py
      - run: python -c "import tomllib; voice = tomllib.load(open('pyproject.toml','rb'))['project']['optional-dependencies']['voice']; missing = [p for p in ('torch','torchaudio','omnivoice','flask','numpy','soundfile') if not any(r.startswith(p) for r in voice)]; raise SystemExit(f'voice extra missing: {missing}') if missing else print('voice extra ok: ' + str(len(voice)) + ' requirements')"
      - run: python -m ruff check src tests scripts tools
      - run: python -m mypy src
      - run: pip check

  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run all .NET tests
        shell: pwsh
        run: .\scripts\test_dotnet.ps1 -Configuration Debug
      - run: dotnet build gui-winui3.Harness/RuApp.Harness.csproj -c Release --nologo
      - run: dotnet build gui-winui3/RuApp.csproj -c Release -r win-x64

  native-overlay:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap manifest vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE '.tmp\vcpkg'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $vcpkgRoot) | Out-Null
          git clone --depth 1 https://github.com/microsoft/vcpkg $vcpkgRoot
          & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat')
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed with exit code $LASTEXITCODE." }
          $env:VCPKG_ROOT = $vcpkgRoot
          & .\scripts\build_ru_desktop_overlay.ps1 -BootstrapVcpkg
