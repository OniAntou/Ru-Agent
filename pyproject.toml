[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ru-runtime"
version = "0.1.0"
description = "Cloud-first Vietnamese-English Ru conversational runtime."
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=1.26",
    "torch>=2.9,<3",
    "SpeechRecognition>=3.10",
    "pyaudio>=0.2",
    "pyvts>=0.3",
    "pygame>=2.6",
    "psutil>=5.9",
    "websockets>=16,<17",
    "pycaw>=20230407; platform_system == 'Windows'",
    "comtypes>=1.4; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "flask>=3.1,<4"]
runtime = [
    "ddgs>=9.0",
    "httpx>=0.25",
    "keyring>=25",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ru_runtime = ["reference_text.txt", "tyc_talk.wav"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
