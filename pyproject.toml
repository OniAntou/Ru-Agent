[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bilingual-mini-gpt"
version = "0.1.0"
description = "An educational Vietnamese-English decoder-only language model trained from scratch."
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=1.26",
    "datasets>=3.0",
    "tokenizers>=0.22,<0.23.1",
    "torch>=2.9,<3",
    "SpeechRecognition>=3.10",
    "pyaudio>=0.2",
    "pyvts>=0.3",
    "pygame>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
qwen = [
    "accelerate>=1.0,<2",
    "bitsandbytes>=0.48,<1",
    "ddgs>=9.0",
    "faiss-cpu>=1.7",
    "peft>=0.14,<1",
    "safetensors>=0.4",
    "sentence-transformers>=2.2",
    "transformers>=5,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
