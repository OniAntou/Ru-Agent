[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ru-local-llama"
version = "0.1.0"
description = "Local Vietnamese-English Ru conversational runtime using LiquidAI LFM2.5-2.6B."
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=1.26",
    "datasets>=3.0",
    "tokenizers>=0.22,<0.23.1",
    "torch>=2.9,<3",
    "SpeechRecognition>=3.10",
    "pyaudio>=0.2",
    "pyvts>=0.3",
    "pygame>=2.6",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "flask>=3.1,<4"]
server = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2,<3",
]
runtime = [
    "accelerate>=1.0,<2",
    "bitsandbytes>=0.48,<1",
    "ddgs>=9.0",
    "httpx>=0.25",
    "keyring>=25",
    "peft>=0.14,<1",
    "transformers>=5,<6",
]
gguf = ["sentencepiece>=0.2,<1"]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
